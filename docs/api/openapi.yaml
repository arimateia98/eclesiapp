openapi: 3.1.0
info:
  title: eclEZapp API
  version: 0.1.0
  description: Contrato inicial da API compartilhada pelas aplicações web e mobile.
servers:
  - url: http://localhost:8080
    description: Ambiente local
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Verifica a disponibilidade da API
      security: []
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
  /login:
    post:
      operationId: createWebSession
      summary: Cria uma sessão web para uma conta previamente convidada
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Sessão criada }
        '422': { description: Credenciais inválidas }
        '429': { description: Limite de tentativas atingido }
  /register:
    post:
      operationId: registerAccount
      summary: Cria uma conta sem vínculo paroquial ou cadastro de servo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password, password_confirmation]
              properties:
                full_name: { type: string, minLength: 2, maxLength: 180 }
                preferred_name: { type: [string, 'null'], maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 10 }
                password_confirmation: { type: string, format: password }
      responses:
        '201': { description: 'Conta criada e sessão iniciada, ainda sem paróquia ou servo' }
        '422': { description: Dados inválidos ou cadastro indisponível }
        '429': { description: Limite de tentativas atingido }
  /logout:
    post:
      operationId: deleteWebSession
      summary: Encerra a sessão web atual
      security:
        - sessionCookie: []
      responses:
        '200': { description: Sessão encerrada }
        '401': { description: Sessão inexistente }
  /auth/google/redirect:
    get:
      operationId: redirectToGoogle
      summary: Inicia autenticação OpenID Connect com Google
      security: []
      responses:
        '302': { description: Redirecionamento para o Google }
        '503': { description: Provedor não configurado no ambiente }
  /auth/google/callback:
    get:
      operationId: handleGoogleCallback
      summary: Processa o retorno do Google e cria ou vincula uma conta sem conceder paróquia ou servo
      security: []
      responses:
        '302': { description: Redirecionamento para a aplicação web }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Retorna a pessoa e as paróquias ativas da sessão
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Contexto autenticado
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/CurrentUser'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401': { description: Não autenticado }
  /api/v1/session/active-parish:
    put:
      operationId: selectActiveParish
      summary: Seleciona na sessão uma paróquia em que o usuário possui vínculo ativo
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parish_id]
              properties:
                parish_id: { type: string, format: uuid }
      responses:
        '200':
          description: Contexto paroquial selecionado
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ActiveParishContext' }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { description: Não autenticado }
        '403': { description: Sem vínculo ativo com a paróquia }
        '422': { description: Identificador inválido }
    delete:
      operationId: clearActiveParish
      summary: Remove a seleção paroquial da sessão atual
      security:
        - sessionCookie: []
      responses:
        '200': { description: Seleção removida }
        '401': { description: Não autenticado }
  /api/v1/active-parish:
    get:
      operationId: getActiveParish
      summary: Resolve o contexto paroquial autorizado da requisição
      description: Usa X-Parish-Id, a seleção da sessão ou seleciona automaticamente o único vínculo ativo.
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: X-Parish-Id
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Contexto paroquial autorizado
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ActiveParishContext' }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { description: Não autenticado }
        '403': { description: Sem vínculo ativo com a paróquia }
        '409': { description: Seleção explícita necessária }
  /api/v1/parishes/{parishId}/servants:
    parameters:
      - $ref: '#/components/parameters/ParishId'
    get:
      operationId: listServants
      summary: Lista servos da paróquia ativa para padre ou administrador
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Lista paginada de servos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Servant' }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { description: Não autenticado }
        '403': { description: Sem contexto ou papel autorizado }
    post:
      operationId: createServant
      summary: Cria pessoa e vínculo de servo sem gerar usuário
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string, minLength: 2, maxLength: 180 }
                preferred_name: { type: [string, 'null'], maxLength: 100 }
                phone: { type: [string, 'null'], maxLength: 32 }
                email: { type: [string, 'null'], format: email }
                joined_on: { type: [string, 'null'], format: date }
      responses:
        '201':
          description: Servo criado sem credenciais
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Servant' }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { description: Não autenticado }
        '403': { description: Sem contexto ou papel autorizado }
        '422': { description: Dados inválidos }
  /api/v1/parishes/{parishId}/servants/{servantId}:
    parameters:
      - $ref: '#/components/parameters/ParishId'
      - in: path
        name: servantId
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateServant
      summary: Altera o estado do vínculo pastoral sem apagar seu histórico
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
                left_on: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Vínculo atualizado
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Servant' }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { description: Não autenticado }
        '403': { description: Sem contexto ou papel autorizado }
        '404': { description: Servo não encontrado na paróquia ativa }
        '422': { description: Dados inválidos }
  /api/v1/parishes/{parishId}/pastoral-areas:
    parameters:
      - $ref: '#/components/parameters/ParishId'
    get:
      operationId: listPastoralAreas
      summary: Lista areas pastorais da paroquia ativa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Catalogo de areas pastorais
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PastoralArea' } }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { description: Nao autenticado }
        '403': { description: Sem contexto ou papel autorizado }
    post:
      operationId: createPastoralArea
      summary: Cria uma area pastoral na paroquia ativa
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 60 }
                name: { type: string, minLength: 2, maxLength: 140 }
                description: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201': { description: Area pastoral criada }
        '401': { description: Nao autenticado }
        '403': { description: Sem contexto ou papel autorizado }
        '422': { description: Dados invalidos ou codigo duplicado }
  /api/v1/parishes/{parishId}/pastoral-functions:
    parameters:
      - $ref: '#/components/parameters/ParishId'
    get:
      operationId: listPastoralFunctions
      summary: Lista funcoes pastorais da paroquia ativa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Catalogo de funcoes pastorais
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PastoralFunction' } }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { description: Nao autenticado }
        '403': { description: Sem contexto ou papel autorizado }
    post:
      operationId: createPastoralFunction
      summary: Cria uma funcao vinculada a uma area da mesma paroquia
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pastoral_area_id, code, name, assignment_mode, requires_qualification]
              properties:
                pastoral_area_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 80 }
                name: { type: string, minLength: 2, maxLength: 140 }
                assignment_mode: { type: string, enum: [PERSON, TEAM, EITHER] }
                requires_qualification: { type: boolean }
      responses:
        '201': { description: Funcao pastoral criada }
        '401': { description: Nao autenticado }
        '403': { description: Sem contexto ou papel autorizado }
        '422': { description: 'Dados invalidos, area externa ou codigo duplicado' }
  /api/v1/parishes/{parishId}/servants/{servantId}/functions:
    parameters:
      - $ref: '#/components/parameters/ParishId'
      - in: path
        name: servantId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: qualifyServant
      summary: Cria ou atualiza a habilitacao pastoral de um servo
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pastoral_function_id]
              properties:
                pastoral_function_id: { type: string, format: uuid }
                status: { type: string, enum: [PENDING, QUALIFIED, SUSPENDED, EXPIRED] }
                qualified_on: { type: [string, 'null'], format: date }
                expires_on: { type: [string, 'null'], format: date }
                notes: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { description: Habilitacao existente atualizada }
        '201': { description: Habilitacao criada }
        '401': { description: Nao autenticado }
        '403': { description: Sem contexto ou papel autorizado }
        '404': { description: Servo nao encontrado na paroquia ativa }
        '422': { description: 'Funcao externa, inativa ou dados invalidos' }
components:
  parameters:
    ParishId:
      in: path
      name: parishId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
  schemas:
    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    CurrentUser:
      type: object
      required: [id, email, active_parish_id, person, parishes]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        active_parish_id: { type: [string, 'null'], format: uuid }
        person:
          type: object
          required: [id, full_name]
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
            preferred_name: { type: [string, 'null'] }
        parishes:
          type: array
          items:
            type: object
            required: [id, name, timezone]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              timezone: { type: string }
    ActiveParishContext:
      type: object
      required: [parish, roles]
      properties:
        parish:
          type: object
          required: [id, name, timezone]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            timezone: { type: string }
        roles:
          type: array
          items: { type: string }
    Servant:
      type: object
      required: [id, parish_id, person, status, joined_on, left_on, has_user, functions]
      properties:
        id: { type: string, format: uuid }
        parish_id: { type: string, format: uuid }
        person:
          type: object
          required: [id, full_name, preferred_name, phone, email]
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
            preferred_name: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'], format: email }
        status: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
        joined_on: { type: [string, 'null'], format: date }
        left_on: { type: [string, 'null'], format: date }
        has_user: { type: boolean }
        functions:
          type: array
          items:
            type: object
            required: [id, status, function_id, function_name, area_name]
            properties:
              id: { type: string, format: uuid }
              status: { type: string, enum: [PENDING, QUALIFIED, SUSPENDED, EXPIRED] }
              function_id: { type: string, format: uuid }
              function_name: { type: string }
              area_name: { type: [string, 'null'] }
    PastoralArea:
      type: object
      required: [id, parish_id, code, name, description, status, functions_count]
      properties:
        id: { type: string, format: uuid }
        parish_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        functions_count: { type: integer, minimum: 0 }
    PastoralFunction:
      type: object
      required: [id, parish_id, pastoral_area_id, area_name, code, name, assignment_mode, requires_qualification, status]
      properties:
        id: { type: string, format: uuid }
        parish_id: { type: string, format: uuid }
        pastoral_area_id: { type: string, format: uuid }
        area_name: { type: [string, 'null'] }
        code: { type: string }
        name: { type: string }
        assignment_mode: { type: string, enum: [PERSON, TEAM, EITHER] }
        requires_qualification: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
