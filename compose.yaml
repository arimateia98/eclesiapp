name: ${COMPOSE_PROJECT_NAME:-eclesiapp}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: eclesiapp-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
      - backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/eclesiapp.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eclesiapp

  nginx:
    image: nginx:1.27-alpine
    container_name: eclesiapp-nginx
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - eclesiapp

  frontend:
    image: node:22-alpine
    container_name: eclesiapp-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "
        if [ ! -f package.json ]; then
          echo 'frontend/package.json não encontrado. Crie o projeto Vue antes de iniciar este serviço.';
          sleep infinity;
        fi &&
        npm install &&
        npm run dev -- --host 0.0.0.0
      "
    depends_on:
      nginx:
        condition: service_started
    networks:
      - eclesiapp

  postgres:
    image: postgres:17-alpine
    container_name: eclesiapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-eclesiapp}
      POSTGRES_USER: ${DB_USERNAME:-eclesiapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eclesiapp_secret}
      TZ: ${TZ:-America/Fortaleza}
      PGTZ: ${TZ:-America/Fortaleza}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-eclesiapp} -d ${DB_DATABASE:-eclesiapp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - eclesiapp

  redis:
    image: redis:7-alpine
    container_name: eclesiapp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_FORWARD_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - eclesiapp

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: eclesiapp-queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
      - backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/eclesiapp.ini:ro
    command: >
      sh -c "
        until [ -f artisan ]; do sleep 2; done;
        php artisan queue:work redis
        --sleep=3
        --tries=3
        --timeout=120
        --max-time=3600
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eclesiapp

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: eclesiapp-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
      - backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/eclesiapp.ini:ro
    command: >
      sh -c "
        until [ -f artisan ]; do sleep 2; done;
        php artisan schedule:work
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eclesiapp

  mailpit:
    image: axllent/mailpit:latest
    container_name: eclesiapp-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - eclesiapp

  adminer:
    image: adminer:latest
    container_name: eclesiapp-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eclesiapp

  redisinsight:
    image: redis/redisinsight:latest
    container_name: eclesiapp-redisinsight
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eclesiapp

networks:
  eclesiapp:
    name: eclesiapp
    driver: bridge

volumes:
  postgres_data:
    name: eclesiapp-postgres-data
  redis_data:
    name: eclesiapp-redis-data
  backend_vendor:
    name: eclesiapp-backend-vendor
  frontend_node_modules:
    name: eclesiapp-frontend-node-modules
  redisinsight_data:
    name: eclesiapp-redisinsight-data
