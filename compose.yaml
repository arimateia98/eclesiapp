name: ${COMPOSE_PROJECT_NAME:-eclesiapp}

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  restart: unless-stopped
  working_dir: /var/www/html
  env_file:
    - backend/.env
  environment:
    DB_DATABASE: ${DB_DATABASE:-eclesiapp}
    DB_USERNAME: ${DB_USERNAME:-eclesiapp}
    DB_PASSWORD: ${DB_PASSWORD:-eclesiapp_local}
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/eclesiapp.ini:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - eclesiapp

services:
  app:
    <<: *backend-service
    command: php-fpm
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - eclesiapp

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_PROXY_TARGET: http://nginx
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci --ignore-scripts && npm run dev"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - eclesiapp

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-eclesiapp}
      POSTGRES_USER: ${DB_USERNAME:-eclesiapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eclesiapp_local}
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - eclesiapp

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - eclesiapp

  queue:
    <<: *backend-service
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120 --max-time=3600
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend-service
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - eclesiapp

  adminer:
    image: adminer:5.5.0-standalone
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eclesiapp

  redisinsight:
    image: redis/redisinsight:3.4.2
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eclesiapp

networks:
  eclesiapp:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
  redisinsight_data:
