name: eclezapp

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      target: development
    env_file: .env
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.29.1-alpine
    ports:
      - "8080:80"
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: infra/docker/node/Dockerfile
    working_dir: /workspace
    command: ["corepack", "pnpm", "--filter", "@eclezapp/web", "dev", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
    depends_on:
      - nginx

  queue:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      target: development
    env_file: .env
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      target: development
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: eclezapp_test
      POSTGRES_USER: eclezapp_test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclezapp_test -d eclezapp_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "8025:8025"

volumes:
  api_vendor:
  postgres_data:
  redis_data:
  root_node_modules:
